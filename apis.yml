name: Alivecor
description: >-
  AliveCor is a digital health company building FDA-cleared, AI-powered personal
  ECG hardware (KardiaMobile 6L, KardiaMobile Card, and the 12-lead Kardia 12L)
  and cardiac-care software (KardiaPro, KardiaStation, KardiaComplete) for
  consumers, clinicians, health systems, biopharma, and payers/employers. Its
  algorithms detect atrial fibrillation, tachycardia, bradycardia, and normal
  sinus rhythm from a single recording. For developers and partners AliveCor
  offers a data-integration layer: Android/iOS SDKs that embed its FDA-cleared
  ECG recording and rhythm-classification algorithms, a HIPAA-compliant REST API
  (KardiaPro cloud) with API-key authentication and webhook notifications for new
  ECG availability, and EHR integration such as GE Healthcare MUSE NX. API/SDK
  access is gated behind a commercial agreement. Backed by Khosla Ventures.
